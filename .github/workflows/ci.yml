name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      CLUE_LLM_PROVIDER: mock   # CI is fully offline; never needs an API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,web]"
      - run: ruff check clue tests && ruff format --check clue tests
      - run: mypy clue
      - run: pytest -q --cov=clue --cov-report=term --cov-fail-under=90

  web:
    # Frontend: typecheck + unit tests + build, and fail if the committed bundle in clue/web/static is stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: bundle drift check
        run: |
          git status --porcelain clue/web/static
          test -z "$(git status --porcelain clue/web/static)" || { echo "::error::clue/web/static is stale - run 'npm run build' in web/ and commit"; exit 1; }
      # live integration (real server + real pages over HTTP/WS)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[web]"
      - run: |
          (CLUE_LLM_PROVIDER=mock python -m clue web --port 8000 --hotseat --saves-dir /tmp/saves --replay-dir /tmp/replays &) && sleep 3
          cd web && CLUE_WEB_URL=http://localhost:8000 npx vitest run src/__tests__/live.integration.test.tsx
