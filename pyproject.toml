[project]
name = "clue-harness"
version = "0.1.0"
description = "Modular AI harness for Classic US Clue (rules engine, manager, agents, strategies, eval)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "typer>=0.12", "rich>=13", "textual>=0.80", "pyyaml>=6", "httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2", "httpx>=0.27"]
dotenv = ["python-dotenv>=1"]  # optional; a built-in minimal .env parser is used when absent

[project.scripts]
clue = "clue.__main__:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clue*"]

[tool.setuptools.package-data]
"clue.web" = ["static/**/*"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007", "UP045", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = false


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
